<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sort</title>
</head>

<body>
    <!-- WAP to read an array from the user and sort them using quick sort. -->

    <script>
        // Quick Sort Function
        function quickSort(arr) {
            // Base case: if array has 1 or 0 elements, it is already sorted
            if (arr.length <= 1) {
                return arr;
            }

            let pivot = arr[arr.length - 1]; // Taking the last element as pivot
            let left = [];
            let right = [];

            // Partitioning the array
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] < pivot) {
                    left.push(arr[i]);
                } else {
                    right.push(arr[i]);
                }
            }

            // Recursively sorting left and right parts
            return [...quickSort(left), pivot, ...quickSort(right)];
        }

        // --- Your original input/output logic starts here ---

        let n = parseInt(prompt("Enter number of elements:"));
        let a = [];

        // Getting array input from user
        for (let i = 0; i < n; i++) {
            a[i] = parseInt(prompt("Enter Element " + (i + 1) + " : "));
        }

        // Printing original array
        document.write("<strong>Original Array:</strong><br/>");
        for (let i = 0; i < n; i++) {
            document.write(a[i] + "<br/>");
        }

        // Calling Quick Sort and assigning sorted values back to 'a'
        a = quickSort(a);

        // Printing sorted array
        document.write("<br/>");
        document.write("<strong>Ascending order (Quick Sort):</strong><br/>");

        for (let i = 0; i < a.length; i++) {
            document.write(a[i] + "<br/>");
        }
    </script>
</body>

</html>
