<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sort Array</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            max-width: 500px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input,
        button {
            padding: 10px;
            margin: 5px 0;
            font-size: 16px;
        }

        input {
            width: 80%;
        }
    </style>
</head>

<body>
    <!-- WAP to read an array form the user and sort them using quick sort. -->
    <div class="container">
        <h2>Quick Sort Algorithm</h2>
        <label for="arrayInput">Enter numbers (comma-separated):</label><br>
        <input type="text" id="arrayInput" placeholder="e.g. 10, 5, 8, 1, 7">
        <button onclick="handleSort()">Sort Array</button>

        <h3>Result:</h3>
        <p id="result"></p>
    </div>

    <script>
        // Quick Sort Implementation
        function quickSort(arr) {
            // Base case: arrays with 1 or 0 elements are already sorted
            if (arr.length <= 1) {
                return arr;
            }

            // Choose the last element as the pivot
            const pivot = arr[arr.length - 1];
            const left = [];
            const right = [];

            // Partition the array into two sub-arrays
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] < pivot) {
                    left.push(arr[i]); // Elements smaller than pivot go left
                } else {
                    right.push(arr[i]); // Elements greater than or equal go right
                }
            }

            // Recursively sort the sub-arrays and combine them with the pivot
            return [...quickSort(left), pivot, ...quickSort(right)];
        }

        // Function to handle user input and display output
        function handleSort() {
            const inputElement = document.getElementById('arrayInput').value;
            const resultElement = document.getElementById('result');

            if (!inputElement.trim()) {
                resultElement.innerHTML = "<em>Please enter some numbers.</em>";
                resultElement.style.color = "red";
                return;
            }

            // Convert the comma-separated string into an array of numbers
            const rawArray = inputElement.split(',');
            const numberArray = [];

            for (let i = 0; i < rawArray.length; i++) {
                const num = parseFloat(rawArray[i].trim());
                if (!isNaN(num)) {
                    numberArray.push(num);
                }
            }

            if (numberArray.length === 0) {
                resultElement.innerHTML = "<em>Invalid input. Please enter valid numbers only.</em>";
                resultElement.style.color = "red";
                return;
            }

            // Sort the array and display it
            const sortedArray = quickSort(numberArray);
            resultElement.style.color = "black";
            resultElement.innerHTML = "<strong>Sorted Array:</strong> " + sortedArray.join(', ');
        }
    </script>
</body>

</html>
