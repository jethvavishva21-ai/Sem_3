<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS Design */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background-color: white;
            width: 350px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-box h2 {
            margin: 0 0 30px;
            color: #333;
            text-transform: uppercase;
            font-weight: bold;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #333;
            border: none;
            border-bottom: 2px solid #adadad;
            outline: none;
            background: transparent;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-bottom: 2px solid #9b59b6;
        }

        .login-btn {
            width: 100%;
            background-color: #9b59b6;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .login-btn:hover {
            background-color: #8e44ad;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>

<body>
    
    <!-- WAP to create a static login page using HTML and JavaScript -->
    
    <div class="login-box">
        <h2>Login</h2>

        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <button class="login-btn" onclick="checkLogin()">Login</button>

        <p id="message"></p>
    </div>

    <script>
        function checkLogin() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;
            let msg = document.getElementById("message");

            if (user === "admin" && pass === "12345") {
                msg.style.color = "green";
                msg.innerHTML = "✅ Login Successful!";
            }
            else if (user === "" || pass === "") {
                msg.style.color = "orange";
                msg.innerHTML = "⚠️ Please enter Username & Password!";
            }
            else {
                msg.style.color = "red";
                msg.innerHTML = "❌ Invalid Username or Password!";
            }
        }
    </script>

</body>

</html>
