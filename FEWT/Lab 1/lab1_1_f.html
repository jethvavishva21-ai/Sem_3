<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>

    <style>
        /* Common Box Style */
        .box1,
        .box2,
        .box3,
        .box4,
        .box5 {
            width: 100px;
            height: 100px;
            position: relative;
        }


        /* Box 1 - ease */
        .box1 {
            background-color: rgb(64, 0, 255);
            animation: movebox1 4s ease infinite;
        }

        @keyframes movebox1 {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(300px, 0);
            }

            50% {
                transform: translate(300px, 100px);
            }

            75% {
                transform: translate(0, 100px);
            }

            100% {
                transform: translate(0, 0);
            }
        }


        /* Box 2 - linear */
        .box2 {
            background-color: rgb(255, 251, 0);
            animation: movebox2 4s linear infinite;
        }

        @keyframes movebox2 {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(300px, 0);
            }

            50% {
                transform: translate(300px, 100px);
            }

            75% {
                transform: translate(0, 100px);
            }

            100% {
                transform: translate(0, 0);
            }
        }


        /* Box 3 - ease-in */
        .box3 {
            background-color: rgb(0, 106, 255);
            animation: movebox3 4s ease-in infinite;
        }

        @keyframes movebox3 {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(300px, 0);
            }

            50% {
                transform: translate(300px, 100px);
            }

            75% {
                transform: translate(0, 100px);
            }

            100% {
                transform: translate(0, 0);
            }
        }


        /* Box 4 - ease-out */
        .box4 {
            background-color: rgb(255, 0, 212);
            animation: movebox4 4s ease-out infinite;
        }

        @keyframes movebox4 {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(300px, 0);
            }

            50% {
                transform: translate(300px, 100px);
            }

            75% {
                transform: translate(0, 100px);
            }

            100% {
                transform: translate(0, 0);
            }
        }


        /* Box 5 - ease-in-out */
        .box5 {
            background-color: rgb(0, 225, 255);
            animation: movebox5 4s ease-in-out infinite;
        }

        @keyframes movebox5 {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(300px, 0);
            }

            50% {
                transform: translate(300px, 100px);
            }

            75% {
                transform: translate(0, 100px);
            }

            100% {
                transform: translate(0, 0);
            }
        }


        /* Same Space + Line */
        .line {
            border-top: 1px solid gray;
            margin: 30px 0;
        }
    </style>

</head>


<body>

    <div>

        <div class="box1"></div>

        <div class="line"></div>

        <div class="box2"></div>

        <div class="line"></div>

        <div class="box3"></div>

        <div class="line"></div>

        <div class="box4"></div>

        <div class="line"></div>

        <div class="box5"></div>

    </div>

</body>

</html>
