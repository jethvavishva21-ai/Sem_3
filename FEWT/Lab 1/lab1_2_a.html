<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        a:link{
            color: orange;
        }

        a:visited{
            color: red;
        }
    </style>
</head>
<body>


    <!-- a. Link after visited red color before visited orange color -->

    <h3>a. Link Effect</h3>
    
    <a href="https://www.google.com">
        Visit Google
    </a>

</body>
</html>
