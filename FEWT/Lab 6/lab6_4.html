<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- WAP to display products stored in array. -->

    <script>
        product = [
            {name:'Cosmetic'},
            {name:'Nail Polish'},
            {name:'Dryer'}
        ]

        document.write("---Product List---" + "<br/>");

        for(i = 0; i < product.length; i++)
        {
            document.write(product[i].name + "<br/>");
        }
    </script>
</body>
</html>
